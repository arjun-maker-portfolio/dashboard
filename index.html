<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#245b43">
<title>WasteWise</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<script>
try{const saved=localStorage.getItem('wastewise-theme');document.documentElement.dataset.theme=saved==='dark'||saved==='light'?saved:window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}catch{document.documentElement.dataset.theme='light';}
</script>
<link rel="stylesheet" href="styles.css">
<link rel="preload" href="assets/fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<script src="focus.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div id="app" aria-live="polite"></div>
</body>
</html>
